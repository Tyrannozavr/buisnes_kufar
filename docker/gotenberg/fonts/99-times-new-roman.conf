<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- DOCX шаблоны используют «Times New Roman»; в контейнере — TeX Gyre Termes (метрически близкий TNR). -->
  <alias binding="strong">
    <family>Times New Roman</family>
    <prefer>
      <family>TeX Gyre Termes</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>Times</family>
    <prefer>
      <family>TeX Gyre Termes</family>
    </prefer>
  </alias>
</fontconfig>
